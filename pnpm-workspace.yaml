packages:
  - "apps/*"
  - "packages/*"

# Packages allowed to run install scripts. Electron 44 has no install script:
# its binary downloads on first use, and the desktop `dev`, `preview` and
# `capture` scripts run `install-electron` first (a no-op once installed).
onlyBuiltDependencies:
  - esbuild
  # Postgres binaries for the server tests and CLI. Their postinstall restores
  # the symlinks inside the Linux and macOS archives.
  - '@embedded-postgres/darwin-arm64'
  - '@embedded-postgres/darwin-x64'
  - '@embedded-postgres/linux-arm64'
  - '@embedded-postgres/linux-x64'
  - '@embedded-postgres/windows-x64'

# Squirrel installer tooling pulled in by electron-builder. We ship NSIS.
ignoredBuiltDependencies:
  - electron-winstaller
