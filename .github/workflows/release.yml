name: Release

# Push a tag like v0.1.0 to build installers on all three platforms and attach
# them to a GitHub Release. Bump apps/desktop/package.json "version" first:
# electron-builder names the files after it.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    env:
      # No code signing yet.
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      # Baked into the renderer at build time. Publishable keys are not secret,
      # but keep them in repository variables so they are easy to rotate.
      VITE_CLERK_PUBLISHABLE_KEY: ${{ vars.VITE_CLERK_PUBLISHABLE_KEY }}
      VITE_API_URL: ${{ vars.VITE_API_URL }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Build installers
        run: pnpm --filter @nvoke/desktop dist

      - uses: actions/upload-artifact@v4
        with:
          name: installers-${{ matrix.os }}
          if-no-files-found: error
          path: |
            apps/desktop/release/*/*.exe
            apps/desktop/release/*/*.dmg
            apps/desktop/release/*/*.AppImage

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: installers
          pattern: installers-*
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          files: installers/**/*
          generate_release_notes: true
