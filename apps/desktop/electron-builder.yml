# Packaging config. No code signing yet: Windows shows SmartScreen and macOS
# needs right click, Open on first launch.
appId: app.nvoke.desktop
productName: nvoke
directories:
  output: release/${version}
  buildResources: build
files:
  - out/**
  - resources/**
  - package.json
asar: true
# The tray icons (resources/) are read by native code, which cannot see into
# the asar. electron-vite's `?asset&asarUnpack` imports point at the copy here.
# MCP clients run the launcher in Node mode, from outside the asar.
asarUnpack:
  - resources/**
  - out/main/mcp-launcher.js
artifactName: ${productName}-${version}-${os}-${arch}.${ext}
# Updates come from GitHub Releases (src/main/updater.ts names the same
# repository). The build writes app-update.yml into the app and latest*.yml
# next to the installers; the release workflow uploads both, so builds here
# always run with --publish never. docs/desktop/updates.md.
publish:
  provider: github
  owner: Mopra
  repo: nvoke.run

# Icons come from `pnpm icons` (scripts/icons.mjs). macOS builds its icns
# from build/icon.png, which follows Apple's grid with padding and a shadow.

# nvoke:// links (the browser sign-in callback) open the app. NSIS and the
# AppImage register it with the OS, macOS reads it from Info.plist.
protocols:
  - name: nvoke
    schemes: [nvoke]

win:
  icon: build/icon.ico
  target:
    - target: nsis
      arch: [x64]
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true

mac:
  target:
    - target: dmg
      arch: [x64, arm64]
    # The zip feeds latest-mac.yml. Unsigned builds cannot install it yet, but
    # the update check reads it, and signing later needs nothing else.
    - target: zip
      arch: [x64, arm64]
  category: public.app-category.business
  identity: null
  # The text macOS shows when the quick window first reads the front tab of
  # Safari, Chrome or Arc (AppleScript needs the user's Automation permission).
  extendInfo:
    NSAppleEventsUsageDescription: nvoke reads the address of the browser tab in front when you press the quick search shortcut, to offer who runs that site. It reads nothing else and never in the background.

linux:
  icon: build/icon-desktop.png
  target:
    - target: AppImage
      arch: [x64]
  category: Office
