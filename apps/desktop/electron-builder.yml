# Packaging config. No code signing yet: Windows shows SmartScreen and macOS
# needs right click, Open on first launch.
appId: app.nvoke.desktop
productName: nvoke
directories:
  output: release/${version}
  buildResources: build
files:
  - out/**
  - package.json
asar: true
artifactName: ${productName}-${version}-${os}-${arch}.${ext}
publish: null

# Icons come from `pnpm icons` (scripts/icons.mjs). macOS builds its icns
# from build/icon.png, which follows Apple's grid with padding and a shadow.

# nvoke:// links (the browser sign-in callback) open the app. NSIS and the
# AppImage register it with the OS, macOS reads it from Info.plist.
protocols:
  - name: nvoke
    schemes: [nvoke]

win:
  icon: build/icon.ico
  target:
    - target: nsis
      arch: [x64]
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true

mac:
  target:
    - target: dmg
      arch: [x64, arm64]
  category: public.app-category.business
  identity: null

linux:
  icon: build/icon-desktop.png
  target:
    - target: AppImage
      arch: [x64]
  category: Office
