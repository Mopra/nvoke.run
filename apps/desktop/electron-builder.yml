# Packaging config. No code signing yet: Windows shows SmartScreen and macOS
# needs right click, Open on first launch.
appId: app.nvoke.desktop
productName: nvoke
directories:
  output: release/${version}
  buildResources: build
files:
  - out/**
  - package.json
asar: true
artifactName: ${productName}-${version}-${os}-${arch}.${ext}
publish: null

win:
  target:
    - target: nsis
      arch: [x64]
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true

mac:
  target:
    - target: dmg
      arch: [x64, arm64]
  category: public.app-category.business
  identity: null

linux:
  target:
    - target: AppImage
      arch: [x64]
  category: Office
